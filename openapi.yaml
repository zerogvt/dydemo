openapi: 3.0.3
info:
  title: dydemo
  version: "1.0"
  description: |
    The demo's endpoints. They are implemented by the backend and reached
    through the gateway, which forwards every request unchanged. Each one
    simulates a different failure mode, for generating observability signals.

    Every request carries an `X-Request-ID`. The gateway takes the caller's or
    generates one, forwards it to the backend and returns it, and both services
    write it in every log line for that call.

    Besides the responses listed per endpoint, the gateway itself answers 502
    when the backend is unreachable or drops the connection (as `/blowup` does
    when it crashes), and 504 when the backend takes longer than
    `BACKEND_TIMEOUT` (8s by default).
servers:
  - url: http://dydemo-gateway-service
    description: The gateway, in-cluster
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID for this call. Generated by the gateway if absent.
      schema:
        type: string
  headers:
    RequestId:
      description: The call's correlation ID, as sent or as generated.
      schema:
        type: string
  responses:
    TransactionCreated:
      description: |
        Transaction created. `transaction_id` names the created record;
        `request_id` is the call's X-Request-ID, which is a different thing.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [transaction_id, request_id]
            properties:
              transaction_id:
                type: string
                example: 77e3be0ccbb611f1b3b8f6385cb2535a
              request_id:
                type: string
                example: 37ff07ed03fa4728b4095f3c4b03adc8
    BadGateway:
      description: Gateway only. The backend was unreachable or dropped the connection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        text/plain:
          schema:
            type: string
            example: "Backend unreachable\n"
    GatewayTimeout:
      description: Gateway only. The backend did not answer within BACKEND_TIMEOUT.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        text/plain:
          schema:
            type: string
            example: "Backend timed out\n"
paths:
  /:
    get:
      summary: Baseline, always 200
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Success.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                example: "Successful response\n"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /server_error:
    get:
      summary: Always 500
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "500":
          description: Simulated server-side failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                example: "Server error\n"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /client_error:
    get:
      summary: Always 400
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "400":
          description: Simulated client-side failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                example: "Client error\n"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /latency:
    get:
      summary: 200 with a latency tail (p90 2s, p99 5s)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Success, after 0s, 2s or 5s.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                example: "Latency endpoint 42\n"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /blowup:
    get:
      summary: 200, or a 30% chance of killing the backend worker
      description: |
        When the backend worker dies mid-request, the connection drops and the
        gateway answers 502.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The worker survived.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                example: "Survived blowup\n"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /transaction:
    get:
      summary: Create a transaction
      operationId: createTransactionGet
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    post:
      summary: Create a transaction
      operationId: createTransactionPost
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
