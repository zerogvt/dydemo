apiVersion: apps/v1
kind: Deployment
metadata:
  name: jumpbox-curl
  namespace: dydemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl-wait
  template:
    metadata:
      labels:
        app: curl-wait
    spec:
      containers:
        - name: jumpbox-curl
          image: regga-h6e5btbnffaee8c7.azurecr.io/dydemo.jumpbox
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
