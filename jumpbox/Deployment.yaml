apiVersion: apps/v1
kind: Deployment
metadata:
  name: jumpbox-curl
  namespace: dydemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl-wait
  template:
    metadata:
      labels:
        app: curl-wait
    spec:
      containers:
        - name: jumpbox-curl
          # Built locally by build_deploy.sh, which stamps a timestamp tag via
          # a throwaway Kustomize overlay. Untagged here on purpose: this file
          # stays untouched by a deploy.
          image: dydemo.jumpbox
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
