apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydemo-backend
  namespace: dydemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydemo-backend
  template:
    metadata:
      labels:
        app: dydemo-backend
    spec:
      containers:
        - name: dydemo-backend-container
          # Built locally by build_deploy.sh, which stamps a timestamp tag via
          # a throwaway Kustomize overlay. Untagged here on purpose: this file
          # stays untouched by a deploy.
          image: dydemo.backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---
# service fronting above deployment
apiVersion: v1
kind: Service
metadata:
  name: dydemo-backend-service
  namespace: dydemo
spec:
  selector:
    app: dydemo-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort
