apiVersion: v1
kind: Namespace
metadata:
  name: dydemo

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydemo-gateway
  namespace: dydemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydemo-gateway
  template:
    metadata:
      labels:
        app: dydemo-gateway
    spec:
      containers:
        - name: dydemo-gateway-container
          # Built locally by build_deploy.sh, which stamps a timestamp tag via
          # a throwaway Kustomize overlay. Untagged here on purpose: this file
          # stays untouched by a deploy.
          image: dydemo.gateway
          imagePullPolicy: IfNotPresent
          env:
            # Backend that /transaction calls. Namespace-relative on purpose,
            # so this resolves to dydemo-backend-service in whichever namespace
            # the Deployment lands in. Override with a full URL to point the
            # gateway somewhere else without rebuilding the image.
            - name: BACKEND_URL
              value: http://dydemo-backend-service/
          ports:
            - containerPort: 5000

---
# service fronting above deployment
apiVersion: v1
kind: Service
metadata:
  name: dydemo-gateway-service
  namespace: dydemo
spec:
  selector:
    app: dydemo-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort
