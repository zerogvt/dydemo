apiVersion: v1
kind: Namespace
metadata:
  name: dydemo

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydemo-gateway
  namespace: dydemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydemo-gateway
  template:
    metadata:
      labels:
        app: dydemo-gateway
    spec:
      containers:
        - name: dydemo-gateway-container
          image: regga-h6e5btbnffaee8c7.azurecr.io/dydemo.gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---
# service fronting above deployment
apiVersion: v1
kind: Service
metadata:
  name: dydemo-gateway-service
  namespace: dydemo
spec:
  selector:
    app: dydemo-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort
